<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eDNA 분석 파이프라인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px}
.pipeline{display:flex;align-items:center;gap:0;flex-wrap:nowrap}
.step{flex-shrink:0;width:100px;border-radius:8px;padding:12px 8px;text-align:center}
.step h3{font-size:14px;font-weight:500;margin:0 0 4px;line-height:1.25}
.step p{font-size:11px;color:#5f5e5a;margin:0;line-height:1.3}
.s-b{background:#e6f1fb;border:0.5px solid #185FA5}.s-b h3{color:#0c447c}
.s-t{background:#e1f5ee;border:0.5px solid #1D9E75}.s-t h3{color:#085041}
.s-p{background:#eeedfe;border:0.5px solid #7F77DD}.s-p h3{color:#3c3489}
.s-g{background:#eaf3de;border:0.5px solid #639922}.s-g h3{color:#27500a}
.arr{flex-shrink:0;padding:0 6px;color:#888780;font-size:18px;display:flex;align-items:center}
</style>
</head>
<body>
<div class="pipeline">
  <div class="step s-b"><h3>해수 채취</h3><p>자동 펌프</p></div>
  <div class="arr">→</div>
  <div class="step s-b"><h3>현장 여과</h3><p>0.45μm 필터</p></div>
  <div class="arr">→</div>
  <div class="step s-t"><h3>DNA 추출</h3><p>CTAB법</p></div>
  <div class="arr">→</div>
  <div class="step s-p"><h3>NGS 시퀀싱</h3><p>Illumina MiSeq</p></div>
  <div class="arr">→</div>
  <div class="step s-p"><h3>종 동정</h3><p>메타바코딩</p></div>
  <div class="arr">→</div>
  <div class="step s-g"><h3>DB 등록</h3><p>바코드 DB</p></div>
</div>
</body>
</html>

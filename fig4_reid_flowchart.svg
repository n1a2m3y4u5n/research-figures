<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" role="img">
  <title>AI 개체 재식별(Re-ID) 흐름도</title>
  <desc>CAM-01에서 볼락 BOL-0042를 최초 포착, AI가 특징 벡터를 추출하여 개체 DB에 저장, CAM-03에서 재탐지 시 패턴 대조 후 시민에게 알림 발송</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans KR', sans-serif; }
    </style>
  </defs>
  <rect width="700" height="260" fill="#ffffff"/>

  <rect x="10" y="62" width="110" height="56" rx="8" fill="#e6f1fb" stroke="#185FA5" stroke-width="0.5"/>
  <text x="65" y="84" font-size="14" font-weight="500" fill="#0c447c" text-anchor="middle" dominant-baseline="central">CAM-01</text>
  <text x="65" y="102" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">최초 포착</text>

  <line x1="120" y1="90" x2="146" y2="90" stroke="#378ADD" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="146" y="62" width="110" height="56" rx="8" fill="#eeedfe" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="201" y="84" font-size="14" font-weight="500" fill="#3c3489" text-anchor="middle" dominant-baseline="central">특징 추출</text>
  <text x="201" y="102" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">체표 패턴</text>

  <line x1="256" y1="90" x2="282" y2="90" stroke="#7F77DD" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="282" y="62" width="110" height="56" rx="8" fill="#f1efe8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="337" y="84" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">개체 DB</text>
  <text x="337" y="102" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">BOL-0042</text>

  <line x1="392" y1="90" x2="418" y2="90" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="418" y="62" width="110" height="56" rx="8" fill="#eeedfe" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="473" y="84" font-size="14" font-weight="500" fill="#3c3489" text-anchor="middle" dominant-baseline="central">패턴 대조</text>
  <text x="473" y="102" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">일치 확인</text>

  <line x1="528" y1="90" x2="554" y2="90" stroke="#7F77DD" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="554" y="62" width="110" height="56" rx="8" fill="#e6f1fb" stroke="#185FA5" stroke-width="0.5"/>
  <text x="609" y="84" font-size="14" font-weight="500" fill="#0c447c" text-anchor="middle" dominant-baseline="central">CAM-03</text>
  <text x="609" y="102" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">재탐지 확인</text>

  <line x1="609" y1="118" x2="609" y2="154" stroke="#1D9E75" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="554" y="154" width="110" height="56" rx="8" fill="#e1f5ee" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="609" y="176" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">시민 알림</text>
  <text x="609" y="194" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">재발견 통보</text>

  <text x="65" y="50" font-size="10" fill="#888780" text-anchor="middle">1 최초 탐지</text>
  <text x="201" y="50" font-size="10" fill="#888780" text-anchor="middle">2 AI 학습</text>
  <text x="337" y="50" font-size="10" fill="#888780" text-anchor="middle">3 DB 저장</text>
  <text x="473" y="50" font-size="10" fill="#888780" text-anchor="middle">4 재식별</text>
  <text x="609" y="50" font-size="10" fill="#888780" text-anchor="middle">5 재탐지</text>
  <text x="637" y="182" font-size="10" fill="#888780" text-anchor="start">6 알림</text>
</svg>
